name: Build

on:
  push:
    branches:
      - master
  workflow_dispatch:

# 创建 Release / 推送 tag 需要写权限；仓库默认的 GITHUB_TOKEN 是只读
permissions:
  contents: write

jobs:
  Android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - name: Check out git repository
        uses: actions/checkout@v5

      - name: Setup Env
        uses: ./.github/actions/setup

      # 用仓库自带的 android/app/debug.keystore 签名，
      # 不再依赖 KEYSTORE_* secrets（新仓库里没有配置这些 secrets）
      - name: Build Packages
        env:
          DISABLE_SVG: 1
        shell: bash
        run: |
          cd android
          ./gradlew assembleRelease \
            -PMYAPP_UPLOAD_STORE_FILE='debug.keystore' \
            -PMYAPP_UPLOAD_KEY_ALIAS='androiddebugkey' \
            -PMYAPP_UPLOAD_STORE_PASSWORD='android' \
            -PMYAPP_UPLOAD_KEY_PASSWORD='android'

      - name: Get package version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV

      - name: Generate file MD5
        run: |
          cd android/app/build/outputs/apk/release
          md5sum *.apk

      - name: Upload Artifact
        uses: ./.github/actions/upload-artifact
        env:
          PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}

  Release:
    name: Release
    runs-on: ubuntu-latest
    needs: [Android]
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Check out git repository
        uses: actions/checkout@v5

      - name: Download Artifacts
        uses: actions/download-artifact@v5
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Get package version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV

      - name: Generate release notes
        run: |
          if [ -f ./publish/hammer-changelog.md ]; then
            cp ./publish/hammer-changelog.md ./release_notes.md
          else
            echo "锤子音乐 v$PACKAGE_VERSION" > ./release_notes.md
          fi
          echo -e '\n### File MD5\n```' >> ./release_notes.md
          cd artifacts
          md5sum *.apk >> ../release_notes.md
          echo -e '```\n' >> ../release_notes.md

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ./release_notes.md
          prerelease: false
          draft: false
          tag_name: v${{ env.PACKAGE_VERSION }}
          files: artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
